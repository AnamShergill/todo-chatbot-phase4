apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      containers:
      - name: backend
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.port }}
          name: http
        env:
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: {{ .Chart.Name }}-config
              key: FRONTEND_URL
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: {{ .Chart.Name }}-config
              key: LOG_LEVEL
        - name: CORS_ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: {{ .Chart.Name }}-config
              key: CORS_ALLOWED_ORIGINS
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret }}
              key: JWT_SECRET
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret }}
              key: OPENAI_API_KEY
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret }}
              key: DATABASE_URL
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: {{ .Values.healthProbe.path }}
            port: http
          initialDelaySeconds: {{ .Values.healthProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.healthProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.healthProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.healthProbe.failureThreshold }}
        readinessProbe:
          httpGet:
            path: {{ .Values.healthProbe.path }}
            port: http
          initialDelaySeconds: 10
          periodSeconds: {{ .Values.healthProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.healthProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.healthProbe.failureThreshold }}
