apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
data:
  FRONTEND_URL: {{ .Values.config.frontendUrl | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsOrigins | quote }}
